name: plugin-api-v3

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: akashic-plugins/plugin-contracts
          ref: 4dd69dd621e029e51e99aa428443fa3a4ec1f6cf
          path: .plugin-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check Plugin API v3
        env:
          PYTHONPATH: .plugin-contracts
        run: python -m akashic_plugin_contracts check plugin.py

  composition-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kachofugetsu09/akashic-agent
          ref: 39cbdcefc155aaf6c41deafd7754a37e6126c23c
          path: .akashic-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            .akashic-core/requirements.txt
            mcp/requirements.txt
      - name: Stage exact Calendar runtime
        run: |
          python -m venv mcp/.venv
          mcp/.venv/bin/python -m pip install \
            -r .akashic-core/requirements.txt \
            -r mcp/requirements.txt \
            pytest pytest-asyncio
      - name: Verify Calendar v3 composition and runtime
        env:
          AKASHIC_AGENT_ROOT: .akashic-core
          PYTHONPATH: .akashic-core:mcp/.venv/lib/python3.13/site-packages
        run: mcp/.venv/bin/python -m pytest -q tests/
