name: plugin-api-v3

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: akashic-plugins/plugin-contracts
          ref: fca5fa976da4a84171a36b57af7c52fae0dea3c4
          path: .cache/plugin-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check Plugin API v3
        env:
          PYTHONPATH: .cache/plugin-contracts
        run: python -m akashic_plugin_contracts check plugin.py

  composition-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kachofugetsu09/akashic-agent
          ref: 7708646d370d055bc580dd3a70930eccc7b86de6
          path: .cache/akashic-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            .cache/akashic-core/requirements.txt
            mcp/requirements.txt
      - name: Stage exact Calendar runtime
        run: |
          python -m venv mcp/.venv
          mcp/.venv/bin/python -m pip install \
            -r .cache/akashic-core/requirements.txt \
            -r mcp/requirements.txt \
            pytest pytest-asyncio
      - name: Verify Calendar v3 composition and runtime
        env:
          AKASHIC_AGENT_ROOT: .cache/akashic-core
          AKASHIC_PLUGIN_FIXTURE_PYTHON: ${{ github.workspace }}/mcp/.venv/bin/python
          PYTHONPATH: ${{ github.workspace }}:.cache/akashic-core:mcp/.venv/lib/python3.13/site-packages:${{ github.workspace }}/.cache/akashic-core/sdk/python/src
        run: mcp/.venv/bin/python -m pytest -q tests/
